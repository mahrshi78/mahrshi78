{% extends "base.html" %}
{% block title %}Sign in · CipherShare{% endblock %}
{% block content %}
<section class="auth-card">
  <p class="eyebrow">PRIVATE FILE EXCHANGE</p>
  <h1>Welcome back</h1>
  <p class="muted">Sign in to securely access your files.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username<input name="username" autocomplete="username" minlength="3" maxlength="32" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary full" type="submit">Sign in</button>
  </form>
  <p class="muted center">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</section>
{% endblock %}
