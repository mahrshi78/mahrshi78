name: Task 5 Secure File Sharing Checks

on:
  push:
    paths:
      - "Task - 5/**"
      - ".github/workflows/task-5-checks.yml"
  pull_request:
    paths:
      - "Task - 5/**"
      - ".github/workflows/task-5-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r "Task - 5/requirements-dev.txt"
      - name: Run security-focused integration tests
        run: python -m pytest "Task - 5/tests" -v
      - name: Run Ruff
        run: python -m ruff check "Task - 5/app" "Task - 5/tests" "Task - 5/run.py"
