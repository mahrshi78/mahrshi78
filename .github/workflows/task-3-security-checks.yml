name: Task 3 Secure Code Checks

on:
  push:
    paths:
      - "Task - 3/**"
      - ".github/workflows/task-3-security-checks.yml"
  pull_request:
    paths:
      - "Task - 3/**"
      - ".github/workflows/task-3-security-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install task dependencies
        run: python -m pip install -r "Task - 3/requirements-dev.txt"
      - name: Run regression and security tests
        run: python -m pytest "Task - 3/tests" -v
      - name: Run Bandit
        run: python -m bandit -q "Task - 3/app/secure_app.py"
      - name: Run Ruff
        run: python -m ruff check "Task - 3/app/secure_app.py" "Task - 3/tests"
