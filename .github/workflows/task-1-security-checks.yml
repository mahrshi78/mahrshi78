name: Task 1 - Security and Quality Checks

on:
  push:
    branches: ["main"]
    paths:
      - "Task - 1/**"
      - ".github/workflows/task-1-security-checks.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "Task - 1/**"
      - ".github/workflows/task-1-security-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Task 1 dependencies
        run: python -m pip install -r "Task - 1/requirements-dev.txt"
      - name: Ruff lint
        run: ruff check "Task - 1/source-code/packet_analyzer.py" "Task - 1/tests/"
      - name: Bandit security scan
        run: bandit -q -r "Task - 1/source-code/packet_analyzer.py"
      - name: Unit tests
        run: python -m pytest -q "Task - 1/tests/"
